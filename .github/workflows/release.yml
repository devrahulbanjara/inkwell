name: Release

# Push a tag like v0.1.0 → builds a universal app, packages the DMG, publishes a GitHub Release,
# then updates the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Needs the macOS 26 SDK (Xcode 26+) for Liquid Glass APIs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build app
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh

      - name: Make DMG
        id: dmg
        run: |
          ./scripts/make-dmg.sh | tee dmg.log
          echo "sha=$(tail -1 dmg.log | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # Same file under a fixed name, so /releases/latest/download/Inkwell.dmg always works.
          cp build/Inkwell-*.dmg build/Inkwell.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          generate_release_notes: true
          body: |
            **[Download Inkwell.dmg](https://github.com/devrahulbanjara/inkwell/releases/latest/download/Inkwell.dmg)**

            **SHA-256:** `${{ steps.dmg.outputs.sha }}`

            Install with Homebrew:
            ```
            brew tap devrahulbanjara/inkwell && brew trust devrahulbanjara/inkwell
            brew install --cask inkwell
            ```

  homebrew:
    needs: release
    uses: ./.github/workflows/update-tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
